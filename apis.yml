name: The Interaction Company Of California
description: >-
  The Interaction Company of California (d/b/a Poke) builds Poke, a proactive AI
  assistant that lives in Apple Messages, WhatsApp, Telegram, and SMS. Poke texts
  like a human, knows the user, and integrates with their email, calendar,
  reminders, and dozens of apps to draft replies, reschedule meetings, pay or
  flag invoices, and book travel. For developers, Poke acts as a Model Context
  Protocol (MCP) client that third parties extend by connecting remote MCP
  servers, and it exposes a minimal HTTP API for sending messages to Poke
  programmatically, plus a first-party `poke` CLI/SDK (npm) and the Kitchen
  platform for building and publishing shareable Recipes. Founded by Marvin von
  Hagen and Felix Schlegel; backed by General Catalyst, Spark Capital, Village
  Global, Earlybird Venture Capital, and Anti Fund.
